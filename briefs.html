  <main>
    <section>
      <div class="wrap">
        <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px;">
          <div>
            <h2>Policy Briefs</h2>
            <p class="sub">Clique sur une fiche : un panneau s’ouvre avec le détail (modal).</p>
          </div>
          <a class="btn" href="rejoindre.html">Proposer un brief</a>
        </div>

        <div class="grid-3">
          <button class="card" style="text-align:left; cursor:pointer;"
            data-brief
            data-title="Brief #01 — Souveraineté industrielle"
            data-summary="Diagnostic rapide, options de politique publique, leviers de financement et de coordination territoriale."
            data-reco="Créer un guichet unique local-régional pour les projets industriels à fort impact et accélérer les procédures de mise en conformité.">
            <span class="pill">Brief</span>
            <h3 style="margin:12px 0 8px;">Brief #01 — Souveraineté industrielle</h3>
            <p class="sub">Résumé : stratégie, options, recommandation.</p>
          </button>

          <button class="card" style="text-align:left; cursor:pointer;"
            data-brief
            data-title="Brief #02 — Logement étudiant & attractivité"
            data-summary="Analyse des tensions, cartographie des acteurs, propositions d’outils (foncier, régulation, partenariats)."
            data-reco="Renforcer les conventions avec bailleurs et développer des résidences à loyers encadrés via partenariats public-privé.">
            <span class="pill">Brief</span>
            <h3 style="margin:12px 0 8px;">Brief #02 — Logement étudiant</h3>
            <p class="sub">Résumé : tensions, acteurs, leviers.</p>
          </button>

          <button class="card" style="text-align:left; cursor:pointer;"
            data-brief
            data-title="Brief #03 — Transition énergétique (terrain)"
            data-summary="Focus sur l’acceptabilité, la communication de projet et les mécanismes de compensation."
            data-reco="Mettre en place une gouvernance locale participative + un mécanisme de partage de valeur pour sécuriser l’adhésion.">
            <span class="pill">Brief</span>
            <h3 style="margin:12px 0 8px;">Brief #03 — Transition énergétique</h3>
            <p class="sub">Résumé : acceptabilité & gouvernance.</p>
          </button>
        </div>
      </div>
    </section>
  </main>
