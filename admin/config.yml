backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "content"
    label: "Contenus du site"
    files:
      # --- 1. ACCUEIL ---
      - name: "featured"
        label: "Accueil - À la une"
        file: "content/featured.json"
        fields:
          - name: "items"
            label: "Cartes (À la une)"
            widget: "list"
            fields:
              - { name: "pill", label: "Badge (ex: Info, Contact)", widget: "string" }
              - { name: "title", label: "Titre / Texte principal", widget: "text" }
              - { name: "sub", label: "Sous-texte (Gris)", widget: "string", required: false }
              - { name: "link", label: "Lien (optionnel)", widget: "string", required: false }

      # --- 2. ÉVÉNEMENTS ---
      - name: "events"
        label: "Page Événements"
        file: "content/events.json"
        fields:
          - name: "events"
            label: "Liste des événements"
            widget: "list"
            fields:
              - { name: "title", label: "Titre", widget: "string" }
              - { name: "cat", label: "Catégorie", widget: "select", options: ["cafe-debat","visite","simulation","rencontre"] }
              - { name: "date", label: "Date (texte)", widget: "string" }
              - { name: "lieu", label: "Lieu", widget: "string" }
              - { name: "desc", label: "Description", widget: "text" }
              - { name: "form", label: "Lien Google Form (inscription)", widget: "string", required: false }

      # --- 3. POLICY BRIEFS ---
      - name: "briefs"
        label: "Page Policy Briefs"
        file: "content/briefs.json"
        fields:
          - name: "briefs"
            label: "Liste des briefs"
            widget: "list"
            fields:
              - { name: "title", label: "Titre", widget: "string" }
              - { name: "tag", label: "Type", widget: "select", options: ["brief","note","research"], required: false }
              - { name: "summary", label: "Résumé", widget: "text" }
              - { name: "reco", label: "Recommandation", widget: "text" }
              - { name: "pdf", label: "Lien PDF (optionnel)", widget: "string", required: false }

      # --- 4. ÉQUIPE (NOUVELLE VERSION) ---
      - name: "team"
        label: "Page Équipe"
        file: "content/team.json"
        fields:
          # A. LE BUREAU
          - name: "bureau"
            label: "1. Le Bureau"
            widget: "list"
            fields:
              - {label: "Nom & Prénom", name: "name", widget: "string"}
              - {label: "Rôle (ex: Président)", name: "role", widget: "string"}
              - {label: "Photo", name: "photo", widget: "image", required: false}
              - {label: "Lien LinkedIn", name: "linkedin", widget: "string", required: false}

          # B. RESPONSABLES
          - name: "responsables"
            label: "2. Responsables de Pôles"
            widget: "list"
            fields:
              - {label: "Nom & Prénom", name: "name", widget: "string"}
              - {label: "Pôle dirigé", name: "role", widget: "string"}
              - {label: "Photo", name: "photo", widget: "image", required: false}
              - {label: "Lien LinkedIn", name: "linkedin", widget: "string", required: false}

          # C. MEMBRES
          - name: "membres"
            label: "3. Tous les membres"
            widget: "list"
            fields:
              - {label: "Nom & Prénom", name: "name", widget: "string"}
              - {label: "Pôle / Rôle", name: "role", widget: "string"}
