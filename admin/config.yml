backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "content"
    label: "Contenus du site"
    files:
      # ... (Tes autres rubriques Accueil, Events, Briefs, Equipe restent ici) ...
      
      # --- 1. ACCUEIL - À LA UNE ---
      - name: "featured"
        label: "Accueil - À la une (Texte)"
        file: "content/featured.json"
        fields:
          - name: "items"
            label: "Cartes (À la une)"
            widget: "list"
            fields:
              - { name: "pill", label: "Badge (ex: Info, Contact)", widget: "string" }
              - { name: "title", label: "Titre / Texte principal", widget: "text" }
              - { name: "sub", label: "Sous-texte (Gris)", widget: "string", required: false }
              - { name: "link", label: "Lien (optionnel)", widget: "string", required: false }

      # --- 2. ACCUEIL - GALERIE ---
      - name: "gallery"
        label: "Accueil - Galerie Photos"
        file: "content/gallery.json"
        fields:
          - name: "photo_groups"
            label: "Albums / Événements"
            widget: "list"
            fields:
              - {label: "Nom de l'album", name: "album_name", widget: "string"}
              - name: "images"
                label: "Photos"
                widget: "list"
                fields:
                   - {label: "Photo", name: "image", widget: "image"}
                   - {label: "Légende", name: "caption", widget: "string", required: false}

      # --- 3. ÉVÉNEMENTS ---
      - name: "events"
        label: "Page Événements"
        file: "content/events.json"
        fields:
          - name: "events"
            label: "Liste des événements"
            widget: "list"
            fields:
              - { name: "title", label: "Titre", widget: "string" }
              - { name: "image", label: "Image de couverture", widget: "image", required: false } 
              - { name: "cat", label: "Catégorie", widget: "select", options: ["cafe-debat","visite","simulation","rencontre"] }
              - { name: "date", label: "Date", widget: "string" }
              - { name: "lieu", label: "Lieu", widget: "string" }
              - { name: "desc", label: "Description", widget: "text" }
              - { name: "form", label: "Lien Inscription", widget: "string", required: false }
              - { name: "photos_link", label: "Lien Photos (Drive)", widget: "string", required: false }

   # --- 4. SIMULATIONS (AMÉLIORÉ) ---
      - name: "simulations"
        label: "Page Simulations"
        file: "content/simulations.json"
        fields:
          - name: "sims"
            label: "Liste des Simulations"
            widget: "list"
            fields:
              - { name: "title", label: "Nom de la Simulation", widget: "string" }
              - { name: "date", label: "Date", widget: "string" }
              - { name: "status", label: "Résultat du vote", widget: "select", options: ["Texte Adopté", "Texte Rejeté", "En cours"], required: false }
              - { name: "desc", label: "Contexte / Description", widget: "text" }
              - { name: "total_seats", label: "Nombre TOTAL de sièges", widget: "number", value_type: "int" }
              
              # LES NOUVEAUX LIENS
              - { name: "photos_link", label: "Lien Album Photos (Drive)", widget: "string", required: false }
              - { name: "pdf_link", label: "Lien PDF (Texte final)", widget: "string", required: false }

              - name: "groups"
                label: "Groupes Parlementaires & Votes"
                widget: "list"
                summary: "{{fields.name}} ({{fields.seats}} sièges)"
                fields:
                  - { name: "name", label: "Nom du Groupe", widget: "string" }
                  - { name: "seats", label: "Sièges", widget: "number", value_type: "int" }
                  - { name: "color", label: "Couleur", widget: "color" }
                  - { name: "label", label: "Sigle court", widget: "string" }
                  - { name: "vote_detail", label: "Détail vote", widget: "string" }

      # --- 5. POLICY BRIEFS ---
      - name: "briefs"
        label: "Page Policy Briefs"
        file: "content/briefs.json"
        fields:
          - name: "briefs"
            label: "Liste des briefs"
            widget: "list"
            fields:
              - { name: "title", label: "Titre", widget: "string" }
              - { name: "tag", label: "Type", widget: "select", options: ["brief","note","research"], required: false }
              - { name: "summary", label: "Résumé", widget: "text" }
              - { name: "reco", label: "Recommandation", widget: "text" }
              - { name: "pdf", label: "Lien PDF", widget: "string", required: false }

      # --- 6. ÉQUIPE ---
      - name: "team"
        label: "Page Équipe"
        file: "content/team.json"
        fields:
          - name: "bureau"
            label: "Le Bureau"
            widget: "list"
            fields:
              - {label: "Nom", name: "name", widget: "string"}
              - {label: "Rôle", name: "role", widget: "string"}
              - {label: "Photo", name: "photo", widget: "image", required: false}
              - {label: "LinkedIn", name: "linkedin", widget: "string", required: false}
          - name: "responsables"
            label: "Responsables"
            widget: "list"
            fields:
              - {label: "Nom", name: "name", widget: "string"}
              - {label: "Rôle", name: "role", widget: "string"}
              - {label: "Photo", name: "photo", widget: "image", required: false}
              - {label: "LinkedIn", name: "linkedin", widget: "string", required: false}
          - name: "membres"
            label: "Membres"
            widget: "list"
            fields:
              - {label: "Nom", name: "name", widget: "string"}
              - {label: "Rôle", name: "role", widget: "string"}

