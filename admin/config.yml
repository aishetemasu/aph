backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "content"
    label: "Contenus du site"
    files:
      - name: "events"
        label: "Événements / Visites"
        file: "content/events.json"
        format: "json"
        fields:
          - label: "Événements"
            name: "events"
            widget: "list"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Catégorie", name: "cat", widget: "select", options: ["cafe-debat","visite","simulation","rencontre"] }
              - { label: "Date (texte)", name: "date", widget: "string" }
              - { label: "Lieu", name: "lieu", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }

      - name: "briefs"
        label: "Policy Briefs"
        file: "content/briefs.json"
        format: "json"
        fields:
          - label: "Briefs"
            name: "briefs"
            widget: "list"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Résumé", name: "summary", widget: "text" }
              - { label: "Recommandation", name: "reco", widget: "text" }
              - { label: "Lien PDF (optionnel)", name: "pdf", widget: "string", required: false }

      - name: "team"
        label: "Équipe"
        file: "content/team.json"
        format: "json"
        fields:
          - label: "Membres"
            name: "members"
            widget: "list"
            fields:
              - { label: "Nom", name: "name", widget: "string" }
              - { label: "Rôle", name: "role", widget: "string" }
              - { label: "Pôle", name: "pole", widget: "string", required: false }
